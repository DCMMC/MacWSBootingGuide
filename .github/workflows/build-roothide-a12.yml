name: Build RootHide A12/XS .deb

on:
  push:
    branches: [roothide-a12-xs]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Install host dependencies
        run: |
          brew update || true
          brew install make ldid xz dpkg go

      - name: Restore and patch MTLCompilerBypassOSCheck source
        run: |
          set -euo pipefail
          git show c09fe186ee1d06fd6abda5b19b15ccf2e2192a71:MTLCompilerBypassOSCheck/Tweak.x \
            > MTLCompilerBypassOSCheck/Tweak.x
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MTLCompilerBypassOSCheck/Tweak.x')
          s = p.read_text()
          old = '''// The rootless iOS 16 Theos SDK used by this project omits xpc/xpc.h.  This\n// is the exact public C ABI needed by the UUID-locked reply observer.\nextern void *xpc_data_create(const void *bytes, size_t length);\n'''
          new = '''// Xcode 18.x SDKs provide the canonical xpc_data_create declaration via\n// the XPC headers. Do not redeclare it as void *: under ARC that conflicts\n// with xpc_object_t and requires an explicit bridge below.\n'''
          if old not in s:
              raise SystemExit('expected xpc_data_create declaration not found')
          s = s.replace(old, new, 1)
          old_return = '    return xpc_data_create(bytes, length);'
          new_return = '    return (__bridge_retained void *)xpc_data_create(bytes, length);'
          if old_return not in s:
              raise SystemExit('expected xpc_data_create call not found')
          s = s.replace(old_return, new_return, 1)
          p.write_text(s)
          PY

      - name: Install RootHide Theos
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          rm -rf "$THEOS"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install patched iOS SDK without installer API dependency
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 2 -L \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "Installed patched iOS SDK: $THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Add macOS SDK for macOS subprojects
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          SDK_VER="$(xcrun --sdk macosx --show-sdk-version)"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$SDK_PATH" "$THEOS/sdks/MacOSX${SDK_VER}.sdk"
          echo "Using MacOSX${SDK_VER}.sdk"

      - name: Build on-device provisioning tools for iPhone XS
        run: |
          set -euo pipefail
          mkdir -p layout/usr/macOS/bin
          rm -rf "$RUNNER_TEMP/ipsw-src" "$RUNNER_TEMP/apfs-src"

          git clone --depth 1 https://github.com/blacktop/ipsw.git "$RUNNER_TEMP/ipsw-src"
          (
            cd "$RUNNER_TEMP/ipsw-src"
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' -o layout-ipsw ./cmd/ipsw
          )
          cp "$RUNNER_TEMP/ipsw-src/layout-ipsw" layout/usr/macOS/bin/ipsw
          chmod 0755 layout/usr/macOS/bin/ipsw

          git clone --depth 1 https://github.com/deploymenttheory/go-apfs-v2.git "$RUNNER_TEMP/apfs-src"
          (
            cd "$RUNNER_TEMP/apfs-src"
            CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
              go build -trimpath -ldflags='-s -w' -o layout-apfs ./cmd/apfs
          )
          cp "$RUNNER_TEMP/apfs-src/layout-apfs" layout/usr/macOS/bin/apfs
          chmod 0755 layout/usr/macOS/bin/apfs

          file layout/usr/macOS/bin/ipsw
          file layout/usr/macOS/bin/apfs

      - name: Verify new scripts before packaging
        run: |
          set -euo pipefail
          bash -n layout/DEBIAN/postinst
          bash -n layout/usr/macOS/bin/macws-firstboot.sh
          bash -n layout/usr/macOS/bin/macws-launch.sh
          bash -n layout/usr/macOS/bin/macws-stop.sh
          python3 -m py_compile layout/usr/macOS/bin/macws-onboardingd.py

      - name: Configure rootless dm.pl packaging
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['THEOS']) / 'makefiles/package/deb.mk'
          s = p.read_text()
          old = 'COPYFILE_DISABLE=1 $(FAKEROOT) -r $(_THEOS_PLATFORM_DPKG_DEB) -Z$(_THEOS_PLATFORM_DPKG_DEB_COMPRESSION) -z$(THEOS_PLATFORM_DEB_COMPRESSION_LEVEL) -b "$(THEOS_STAGING_DIR)" "$(_THEOS_DEB_PACKAGE_FILENAME)"'
          new = 'COPYFILE_DISABLE=1 $(_THEOS_PLATFORM_DPKG_DEB) -Z$(_THEOS_PLATFORM_DPKG_DEB_COMPRESSION) -z$(THEOS_PLATFORM_DEB_COMPRESSION_LEVEL) -b "$(THEOS_STAGING_DIR)" "$(_THEOS_DEB_PACKAGE_FILENAME)"'
          if old not in s:
              raise SystemExit('expected deb.mk fakeroot command not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n '_THEOS_PLATFORM_DPKG_DEB' "$THEOS/makefiles/package/deb.mk"

      - name: Build RootHide package
        env:
          GO_EASY_ON_ME: "1"
          FINALPACKAGE: "1"
          STRIP: "0"
          OPTFLAG: "-O2"
          THEOS_PACKAGE_SCHEME: roothide
          ARCHS: "arm64 arm64e"
          TARGET: "iphone:clang:16.5:15.0"
        run: |
          set -euo pipefail
          gmake clean
          gmake -j"$(sysctl -n hw.logicalcpu)" package

      - name: Verify package metadata, maintainer script and Mach-O slices
        run: |
          set -euo pipefail
          PKG=$(find packages -maxdepth 1 -name '*.deb' -type f | head -n 1)
          test -n "$PKG"
          echo "Package: $PKG"
          dpkg-deb -I "$PKG" | tee package-info.txt
          dpkg-deb -I "$PKG" | grep -q 'Architecture: iphoneos-arm64e'
          mkdir -p extracted control
          dpkg-deb -x "$PKG" extracted
          dpkg-deb -e "$PKG" control
          bash -n control/postinst
          test -x extracted/var/jb/usr/macOS/bin/ipsw
          test -x extracted/var/jb/usr/macOS/bin/apfs
          test -f extracted/var/jb/usr/macOS/bin/macws-onboardingd.py
          found=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -Eq 'Mach-O.*(arm64|arm64e)'; then
              echo "== $f =="
              file "$f"
              found=1
            fi
          done < <(find extracted -type f -print0)
          test "$found" -eq 1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: macosbooter-roothide-a12-xs
          path: |
            packages/*.deb
            package-info.txt
          if-no-files-found: error
