name: Build RootHide A12/XS .deb

on:
  push:
    branches: [roothide-a12-xs]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Install host dependencies
        run: |
          brew update || true
          brew install make ldid xz fakeroot dpkg

      - name: Restore and patch MTLCompilerBypassOSCheck source
        run: |
          set -euo pipefail
          # The previous commit contains the complete source; use it as the
          # canonical baseline and apply only the Xcode 18 SDK compatibility
          # change required for xpc_data_create under ARC.
          git show c09fe186ee1d06fd6abda5b19b15ccf2e2192a71:MTLCompilerBypassOSCheck/Tweak.x \
            > MTLCompilerBypassOSCheck/Tweak.x
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MTLCompilerBypassOSCheck/Tweak.x')
          s = p.read_text()
          old = '''// The rootless iOS 16 Theos SDK used by this project omits xpc/xpc.h.  This\n// is the exact public C ABI needed by the UUID-locked reply observer.\nextern void *xpc_data_create(const void *bytes, size_t length);\n'''
          new = '''// Xcode 18.x SDKs provide the canonical xpc_data_create declaration via\n// the XPC headers. Do not redeclare it as void *: under ARC that conflicts\n// with xpc_object_t and forces an invalid implicit Objective-C/C pointer cast.\n'''
          if old not in s:
              raise SystemExit('expected xpc_data_create declaration not found')
          s = s.replace(old, new, 1)
          old_return = '    return xpc_data_create(bytes, length);'
          new_return = '    return (__bridge_retained void *)xpc_data_create(bytes, length);'
          if old_return not in s:
              raise SystemExit('expected xpc_data_create call not found')
          s = s.replace(old_return, new_return, 1)
          p.write_text(s)
          PY
          grep -n -A4 -B4 'xpc_data_create' MTLCompilerBypassOSCheck/Tweak.x

      - name: Install RootHide Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Add macOS SDK for macOS subprojects
        run: |
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          SDK_VER="$(xcrun --sdk macosx --show-sdk-version)"
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$SDK_PATH" "$HOME/theos/sdks/MacOSX${SDK_VER}.sdk"
          echo "Using MacOSX${SDK_VER}.sdk"

      - name: Build RootHide package
        env:
          GO_EASY_ON_ME: "1"
          FINALPACKAGE: "1"
          STRIP: "0"
          OPTFLAG: "-O2"
          THEOS_PACKAGE_SCHEME: roothide
          ARCHS: "arm64 arm64e"
          TARGET: "iphone:clang:latest:15.0"
        run: |
          gmake clean
          gmake -j"$(sysctl -n hw.logicalcpu)" package

      - name: Verify package metadata and Mach-O slices
        run: |
          set -euo pipefail
          PKG=$(find packages -maxdepth 1 -name '*.deb' -type f | head -n 1)
          test -n "$PKG"
          echo "Package: $PKG"
          dpkg-deb -I "$PKG" | tee package-info.txt
          dpkg-deb -I "$PKG" | grep -q 'Architecture: iphoneos-arm64e'
          mkdir -p extracted
          dpkg-deb -x "$PKG" extracted
          found=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -Eq 'Mach-O.*(arm64|arm64e)'; then
              echo "== $f =="
              xcrun vtool -show-build "$f" 2>/dev/null || true
              found=1
            fi
          done < <(find extracted -type f -print0)
          test "$found" -eq 1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: macosbooter-roothide-a12-xs
          path: |
            packages/*.deb
            package-info.txt
          if-no-files-found: error
